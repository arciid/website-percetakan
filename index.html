<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borneo Grafisindo — Premium Catalog Prototype</title>
<meta name="description" content="Premium catalog prototype for Borneo Grafisindo">
<style>
:root{
  --black:#171719; --black2:#222226; --yellow:#ffc900; --red:#e52b32;
  --paper:#f5f5f2; --white:#fff; --muted:#737377; --line:#deded8;
  --radius:22px; --shadow:0 18px 50px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--black);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.container{width:min(1180px,calc(100% - 40px));margin:auto}
.topline{height:4px;background:linear-gradient(90deg,var(--yellow) 0 70%,var(--red) 70%)}
.nav{position:sticky;top:0;z-index:30;background:rgba(23,23,25,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-inner{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{height:48px;width:auto;display:block;object-fit:contain;background:#fff;border-radius:10px;padding:2px}
.navlinks{display:flex;gap:28px;color:#eee;font-size:14px;font-weight:700}
.navlinks a:hover{color:var(--yellow)}
.nav-cta{background:var(--yellow);color:var(--black);padding:12px 18px;border-radius:12px;font-weight:900;border:0}
.menu{display:none;background:transparent;border:1px solid #444;color:#fff;border-radius:10px;padding:10px}
.hero{background:var(--black);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-20% -10%;background:
  radial-gradient(circle at 82% 20%,rgba(255,201,0,.15),transparent 28%),
  linear-gradient(130deg,transparent 0 62%,rgba(229,43,50,.08) 62% 64%,transparent 64% 100%);
  pointer-events:none}
.hero-inner{min-height:690px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:50px;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--yellow);text-transform:uppercase}
.eyebrow:before{content:"";width:28px;height:3px;background:var(--red)}
h1{font-size:clamp(48px,7vw,88px);line-height:.92;letter-spacing:-.055em;margin:20px 0 24px;max-width:780px}
h1 span{color:var(--yellow)}
.hero-copy{font-size:18px;line-height:1.7;color:#c8c8cb;max-width:600px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{border:0;border-radius:14px;padding:15px 20px;font-weight:900}
.btn-primary{background:var(--yellow);color:var(--black)}
.btn-secondary{background:transparent;color:#fff;border:1px solid #4b4b50}
.hero-art{position:relative;min-height:470px;display:grid;place-items:center}
.logo-orbit{position:absolute;width:min(450px,78vw);aspect-ratio:1;border:1px solid rgba(255,255,255,.12);border-radius:50%}
.logo-orbit:before,.logo-orbit:after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(255,201,0,.2)}
.logo-orbit:after{inset:20%;border-color:rgba(229,43,50,.2)}
.hero-logo{width:min(390px,72vw);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.45);position:relative;z-index:2}
.floating-tag{position:absolute;right:0;bottom:28px;background:#fff;color:var(--black);padding:13px 16px;border-radius:14px;font-size:12px;font-weight:900;box-shadow:var(--shadow)}
.section{padding:92px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:34px}
.kicker{font-size:12px;font-weight:900;letter-spacing:.16em;color:#777;text-transform:uppercase}
h2{font-size:clamp(34px,4vw,56px);letter-spacing:-.04em;line-height:1;margin:8px 0 0}
.search{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 17px;height:56px;box-shadow:0 10px 30px rgba(0,0,0,.04)}
.search:focus-within{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,201,0,.14)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:15px}
.filters{display:flex;gap:9px;overflow:auto;padding-bottom:8px;margin-bottom:28px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{border:1px solid #d6d6d0;background:transparent;border-radius:999px;padding:10px 16px;font-weight:800;white-space:nowrap}
.filter.active{background:var(--black);color:var(--yellow);border-color:var(--black)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:#cfcfc8}
.product-photo{aspect-ratio:4/3;background:linear-gradient(135deg,#ddd,#fff);position:relative;overflow:hidden}
.product-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
.card:hover .product-photo img{transform:scale(1.05)}
.photo-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-weight:900;letter-spacing:.08em;font-size:12px}
.card-body{padding:19px}
.badge{font-size:10px;letter-spacing:.12em;font-weight:900;color:#8b8b8d}
.card h3{margin:8px 0 4px;font-size:22px;letter-spacing:-.03em}
.card p{margin:0;color:var(--muted);font-size:13px}
.card-link{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-weight:900;font-size:13px}
.card-link span:last-child{color:var(--red);font-size:20px}
.dark-section{background:var(--black);color:#fff}
.portfolio{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}
.port-card{min-height:240px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(135deg,#343438,#161618);border:1px solid #38383d}
.port-card.tall{grid-row:span 2;min-height:500px}
.port-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.65))}
.port-label{position:absolute;left:22px;bottom:20px;z-index:2;font-weight:900}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feature{background:#fff;border-radius:18px;padding:28px;border:1px solid var(--line)}
.feature strong{font-size:18px;display:block;margin-bottom:8px}
.feature p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
.cta{background:var(--yellow);padding:60px 0}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:30px}
.cta h2{max-width:650px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.modal-box{width:min(920px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:26px;box-shadow:0 40px 120px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr 1fr}
.modal-media{min-height:480px;background:linear-gradient(135deg,#ddd,#fff);display:grid;place-items:center;padding:24px}
.modal-media img{width:100%;height:100%;object-fit:cover;border-radius:18px;min-height:430px}
.modal-content{padding:34px}
.close{float:right;border:0;background:#e7e7e1;border-radius:50%;width:40px;height:40px;font-size:20px}
.option-group{margin:24px 0}
.option-group label{font-size:11px;font-weight:900;letter-spacing:.12em;color:#777;display:block;margin-bottom:9px}
.options{display:flex;gap:8px;flex-wrap:wrap}
.option{border:1px solid #ccc;background:#fff;border-radius:11px;padding:11px 13px;font-weight:800}
.option.selected{background:var(--black);color:var(--yellow);border-color:var(--black)}
.qty{display:flex;align-items:center;width:max-content;border:1px solid #ccc;border-radius:12px;overflow:hidden;background:#fff}
.qty button{width:42px;height:42px;border:0;background:#fff;font-weight:900}
.qty span{min-width:52px;text-align:center;font-weight:900}
.mobile-order{display:none}
@media(max-width:850px){
 .container{width:min(100% - 28px,700px)}
 .navlinks,.nav-cta{display:none} .menu{display:block}
 .hero-inner{grid-template-columns:1fr;min-height:auto;padding:75px 0 50px}
 .hero-art{min-height:330px;order:-1}
 .hero-logo{width:min(300px,80vw)}
 .logo-orbit{width:340px}
 .section{padding:65px 0}
 .section-head{display:block}
 .search{margin-top:20px}
 .grid{grid-template-columns:repeat(2,1fr);gap:13px}
 .card-body{padding:15px} .card h3{font-size:18px}
 .portfolio{grid-template-columns:1fr 1fr} .port-card.tall{min-height:360px}
 .features{grid-template-columns:1fr}
 .cta-inner{display:block}
 .modal-box{grid-template-columns:1fr;max-height:94vh}
 .modal-media{min-height:250px} .modal-media img{min-height:250px}
}
@media(max-width:520px){
 h1{font-size:50px}
 .hero-copy{font-size:16px}
 .grid{grid-template-columns:1fr 1fr}
 .product-photo{aspect-ratio:1}
 .portfolio{grid-template-columns:1fr}
 .port-card.tall{min-height:300px}
 .port-card{min-height:200px}
 .modal-content{padding:22px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
