<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARCI — Digital Print & Studio Catalog</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .bg-ambient-black { background-color: #08080a !important; position: relative; overflow: hidden; }
  .yellow-glow-layer {
    position: absolute; width: 100%; height: 100%; top: 0; left: 0;
    background: radial-gradient(circle at 50% 35%, rgba(250, 204, 21, 0.22) 0%, rgba(234, 179, 8, 0.05) 45%, transparent 70%);
    pointer-events: none; z-index: 1; mix-blend-mode: screen;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  #mediaModal, #orderModal, #sosmedModal { transition: opacity 0.25s ease, visibility 0.25s ease; }
  #mediaModal.show, #orderModal.show, #sosmedModal.show { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; }
</style>
</head>
<body class="bg-neutral-950 flex items-center justify-center min-h-screen">

  <!-- Frame Mobile Utama -->
  <div class="w-full max-w-[414px] h-screen sm:h-[844px] sm:my-6 relative overflow-hidden sm:rounded-[2.5rem] bg-black text-white font-sans select-none sm:border sm:border-white/10 flex flex-col justify-between shadow-2xl">

    <!-- CONTAINER SLIDE DINAMIS -->
    <div id="mainSlideContainer" class="w-full h-full overflow-y-auto no-scrollbar pb-16 p-4 bg-ambient-black flex flex-col justify-between relative">
      <div class="yellow-glow-layer"></div>

      <!-- HEADER BRAND -->
      <div class="relative z-20 flex items-center justify-between pt-1 pb-1">
        <div class="flex items-center gap-2.5">
          <img src="logo test.png" alt="Logo" class="h-10 w-auto object-contain drop-shadow" onerror="this.style.display='none'">
          <div>
            <span class="font-extrabold text-base tracking-wider text-white block leading-none">ARCI</span>
            <span class="text-[9px] font-medium text-yellow-400 tracking-tight block mt-0.5">Solusi Cetak & Digital Studio</span>
          </div>
        </div>
        <span id="slideIndicator" class="text-[8.5px] tracking-widest border border-yellow-400/30 rounded-full px-2.5 py-0.5 text-yellow-300 font-semibold bg-black/50 backdrop-blur-md">
          1/9 • STICKER
        </span>
      </div>

      <!-- MEDIA PREVIEW CONTAINER -->
      <div class="relative z-20 space-y-1.5">
        <div class="relative h-[180px] w-full rounded-2xl overflow-hidden border border-white/15 bg-black/60 shadow-xl">
          <img id="previewImg" src="gbr-vinyl.JPG" class="w-full h-full object-cover">
          <video id="previewVid" autoplay loop muted playsinline class="hidden w-full h-full object-cover">
            <source id="previewVidSrc" src="video-vinyl.mp4" type="video/mp4">
          </video>

          <!-- TAB SWITCHER -->
          <div class="absolute top-2 right-2 z-20 flex bg-black/70 p-0.5 rounded-xl border border-white/20 backdrop-blur-md shadow">
            <button id="tabFoto" onclick="switchTab('foto')" class="px-2.5 py-0.5 rounded-lg text-[8.5px] font-bold bg-yellow-400 text-black shadow">📸 Foto</button>
            <button id="tabVideo" onclick="switchTab('video')" class="px-2.5 py-0.5 rounded-lg text-[8.5px] font-bold text-gray-300">🎥 Tekstur</button>
          </div>

          <button onclick="openMediaModal()" class="absolute bottom-2 right-2 z-20 bg-black/70 hover:bg-black text-white text-[8px] font-bold px-2 py-0.5 rounded-lg border border-white/20 backdrop-blur-md">
            🔍 Perbesar
          </button>
        </div>

        <!-- DESKRIPSI -->
        <div class="p-2 rounded-xl bg-black/50 border border-white/10 text-[10px] leading-relaxed backdrop-blur-md">
          <span id="prodTitle" class="font-extrabold text-yellow-400 text-[11px] uppercase block mb-0.5">Stiker Vinyl Premium ⭐ REKOMENDASI</span>
          <p id="prodDesc" class="text-neutral-300 font-normal">Bahan basis plastik lentur, 100% tahan air & tidak mudah robek.</p>
        </div>
      </div>

      <!-- PANEL PILIHAN DINAMIS -->
      <div id="dynamicOptionsPanel" class="relative z-20 space-y-2 pb-14">
        <!-- Render otomatis via JS -->
      </div>
    </div>

    <!-- FIXED BOTTOM BAR -->
    <div class="absolute bottom-0 left-0 right-0 z-40 bg-neutral-900/95 border-t border-white/15 backdrop-blur-xl p-2.5 flex items-center justify-between gap-1.5 shadow-2xl">
      <button onclick="prevSlide()" class="w-11 h-11 rounded-xl bg-white/10 border border-white/15 text-white font-bold flex items-center justify-center">◀</button>
      
      <button onclick="openOrderModal()" class="flex-1 h-11 rounded-xl bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-extrabold text-xs tracking-wider flex items-center justify-center gap-1.5 shadow-lg shadow-yellow-400/20 uppercase">
        <span>💬 PESAN VIA WA</span>
      </button>

      <button onclick="nextSlide()" class="w-11 h-11 rounded-xl bg-white/10 border border-white/15 text-white font-bold flex items-center justify-center">▶</button>
    </div>

    <!-- MODAL ORDER -->
    <div id="orderModal" onclick="closeOrderModal()" class="invisible opacity-0 fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
      <div onclick="event.stopPropagation()" class="relative w-full max-w-sm rounded-2xl bg-neutral-900 p-4 border border-yellow-400/50 space-y-3">
        <h3 class="text-sm font-extrabold text-yellow-400 uppercase">Formulir Pemesanan</h3>
        <input id="modalNama" type="text" placeholder="Nama Pemesan / Olshop" class="w-full bg-neutral-950 border border-white/20 rounded-lg p-2 text-xs text-white">
        <textarea id="modalCatatan" rows="2" placeholder="Catatan tambahan (Opsional)" class="w-full bg-neutral-950 border border-white/20 rounded-lg p-2 text-xs text-white"></textarea>
        <button onclick="submitWAOrder()" class="w-full py-2.5 rounded-xl bg-yellow-400 text-black font-extrabold text-xs uppercase">Kirim via WhatsApp</button>
      </div>
    </div>

    <!-- MODAL LIGHTBOX -->
    <div id="mediaModal" onclick="closeMediaModal()" class="invisible opacity-0 fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
      <button onclick="closeMediaModal()" class="absolute top-5 right-5 text-white bg-white/10 rounded-full w-10 h-10 font-bold z-50">✕</button>
      <img id="modalImg" src="" class="hidden max-h-[80vh] object-contain rounded-2xl">
      <video id="modalVid" autoplay loop muted playsinline class="hidden max-h-[80vh] object-contain rounded-2xl"><source id="modalVidSrc" src="" type="video/mp4"></video>
    </div>

  </div>

<script>
  const WA_NUMBER = "6281234567890";
  let currentSlideIndex = 0;
  let activeTab = 'foto';

  const products = [
    {
      name: "STICKER", title: "Stiker Kustom A3+",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Stiker Vinyl Premium ⭐", desc: "Bahan basis plastik lentur, 100% tahan air & tidak mudah robek.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Pilih Bahan:</span>
        <div class="flex gap-1 overflow-x-auto no-scrollbar py-1">
          <label class="cursor-pointer"><input type="radio" name="sub" value="Vinyl" checked class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Vinyl</div></label>
          <label class="cursor-pointer"><input type="radio" name="sub" value="Kromo" class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Kromo</div></label>
          <label class="cursor-pointer"><input type="radio" name="sub" value="Hologram" class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Hologram</div></label>
        </div></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Ukuran (A3+ / cm)" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Order" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "BANNER", title: "Flexi Banner Spanduk",
      img: "flexi-280.jpg", vid: "video-flexi-280.mp4",
      descTitle: "Flexi Standar 280gr 🏷️", desc: "Tekstur berserat standar untuk spanduk outdoor event singkat.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Jenis Flexi:</span>
        <div class="grid grid-cols-2 gap-1.5 pt-1">
          <label class="cursor-pointer"><input type="radio" name="sub" value="Flexi 280gr" checked class="peer hidden"><div class="py-1.5 text-center rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Flexi 280gr</div></label>
          <label class="cursor-pointer"><input type="radio" name="sub" value="Flexi Korea 440gr" class="peer hidden"><div class="py-1.5 text-center rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Korea 440gr</div></label>
        </div></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Ukuran (cm/meter)" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Pcs" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "KERTAS A3+", title: "Cetak Kertas A3+",
      img: "art-paper-260.jpg", vid: "video-vinyl.mp4",
      descTitle: "Art Carton 260gr ⭐", desc: "Kertas tebal licin & kaku untuk kartu nama, brosur, & cover.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Jenis Kertas:</span>
        <select id="subSelect" class="w-full bg-neutral-900 border border-white/20 rounded p-1 text-[9px] text-white mt-1">
          <option value="Art Carton 260gr">Art Carton 260gr</option>
          <option value="Art Paper 150gr">Art Paper 150gr</option>
          <option value="HVS 100gr">HVS 100gr</option>
          <option value="Fancy Paper">Fancy Paper / Linen</option>
        </select></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Ukuran (A3+ / A4)" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Lembar" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "INDOOR", title: "Indoor Meteran",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Maxdecal Stiker High-Res ⭐", desc: "Stiker vinyl cetak mesin indoor kualitas warna terbaik.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Bahan Indoor:</span>
        <select id="subSelect" class="w-full bg-neutral-900 border border-white/20 rounded p-1 text-[9px] text-white mt-1">
          <option value="Maxdecal">Maxdecal Vinyl</option>
          <option value="Ritrama">Ritrama Vinyl</option>
          <option value="Albatros">Albatros Roll Up</option>
          <option value="Backlite">Backlite Neon Box</option>
        </select></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Panjang x Lebar (cm)" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Meter/Pcs" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "AKRILIK", title: "Akrilik & Plakat",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Akrilik Custom Laser 👑", desc: "Plakat penghargaan & display logo bening mengkilap.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Varian Akrilik:</span>
        <select id="subSelect" class="w-full bg-neutral-900 border border-white/20 rounded p-1 text-[9px] text-white mt-1">
          <option value="Bening 3mm">Akrilik Bening 3mm</option>
          <option value="Bening 5mm">Akrilik Bening 5mm</option>
          <option value="Gold Mirror">Akrilik Gold Mirror</option>
        </select></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Ukuran (cm)" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Pcs" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "APPAREL", title: "Apparel & ID Card",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Kaos Sablon DTF & Lanyard", desc: "Sablon kaos pekat tahan cuci & cetak ID card / tali lanyard.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Pilih Produk:</span>
        <div class="flex gap-1 pt-1">
          <label class="cursor-pointer"><input type="radio" name="sub" value="Kaos DTF" checked class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Kaos DTF</div></label>
          <label class="cursor-pointer"><input type="radio" name="sub" value="Lanyard Tali" class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Lanyard</div></label>
          <label class="cursor-pointer"><input type="radio" name="sub" value="ID Card PVC" class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">ID Card</div></label>
        </div></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Size / Ukuran Tali" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Pcs" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "MERCHANDISE", title: "Merchandise & Souvenir",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Tumbler & Souvenir Promosi", desc: "Tumbler stainless grafir laser & paper bag promosi kantor.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Item Souvenir:</span>
        <select id="subSelect" class="w-full bg-neutral-900 border border-white/20 rounded p-1 text-[9px] text-white mt-1">
          <option value="Tumbler Stainless">Tumbler Stainless Custom</option>
          <option value="Pulpen Promosi">Pulpen Promosi</option>
          <option value="Paper Bag">Paper Bag Custom</option>
        </select></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Kapasitas / Ukuran" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Pcs" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "SIGNAGE", title: "Signage & Nomor Custom",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Nomor Meja & Plat Rumah", desc: "Signage akrilik estetik tahan cuaca panas & hujan.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Jenis Signage:</span>
        <div class="flex gap-1 pt-1">
          <label class="cursor-pointer"><input type="radio" name="sub" value="Nomor Meja Cafe" checked class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Nomor Meja</div></label>
          <label class="cursor-pointer"><input type="radio" name="sub" value="Nomor Rumah Outdoor" class="peer hidden"><div class="px-3 py-1 rounded bg-white/5 border border-white/20 peer-checked:bg-yellow-400 peer-checked:text-black text-[9px] font-bold">Nomor Rumah</div></label>
        </div></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Ukuran (cm)" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Set" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    },
    {
      name: "DISPLAY", title: "Display Stand & Board",
      img: "gbr-vinyl.JPG", vid: "video-vinyl.mp4",
      descTitle: "Roll Up & X-Banner Stand", desc: "Perlengkapan promosi pameran rangka kokoh & mudah dibawa.",
      optionsHtml: `
        <div><span class="text-[9px] font-bold text-yellow-400 uppercase">Tipe Display:</span>
        <select id="subSelect" class="w-full bg-neutral-900 border border-white/20 rounded p-1 text-[9px] text-white mt-1">
          <option value="Roll Up Banner">Roll Up Banner Alumunium</option>
          <option value="X-Banner Stand">X-Banner Stand</option>
          <option value="Tripod Display">Tripod Display</option>
          <option value="Foam Board">Foam Board Custom</option>
        </select></div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="ukuran" type="text" placeholder="Ukuran Frame" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
          <input id="jumlah" type="text" placeholder="Jumlah Set" class="bg-neutral-900 border border-white/20 rounded p-1.5 text-[9.5px] text-white">
        </div>`
    }
  ];

  function renderSlide() {
    const p = products[currentSlideIndex];
    document.getElementById('slideIndicator').textContent = `${currentSlideIndex + 1}/9 • ${p.name}`;
    document.getElementById('previewImg').src = p.img;
    document.getElementById('previewVidSrc').src = p.vid;
    document.getElementById('previewVid').load();
    document.getElementById('prodTitle').textContent = p.descTitle;
    document.getElementById('prodDesc').textContent = p.desc;
    document.getElementById('dynamicOptionsPanel').innerHTML = p.optionsHtml;
    switchTab('foto');
  }

  function nextSlide() {
    currentSlideIndex = (currentSlideIndex + 1) % products.length;
    renderSlide();
  }

  function prevSlide() {
    currentSlideIndex = (currentSlideIndex - 1 + products.length) % products.length;
    renderSlide();
  }

  function switchTab(type) {
    activeTab = type;
    const img = document.getElementById('previewImg');
    const vid = document.getElementById('previewVid');
    const tF = document.getElementById('tabFoto');
    const tV = document.getElementById('tabVideo');
    if(type === 'foto') {
      img.classList.remove('hidden'); vid.classList.add('hidden');
      tF.className = "px-2.5 py-0.5 rounded-lg text-[8.5px] font-bold bg-yellow-400 text-black shadow";
      tV.className = "px-2.5 py-0.5 rounded-lg text-[8.5px] font-bold text-gray-300";
    } else {
      img.classList.add('hidden'); vid.classList.remove('hidden');
      tV.className = "px-2.5 py-0.5 rounded-lg text-[8.5px] font-bold bg-yellow-400 text-black shadow";
      tF.className = "px-2.5 py-0.5 rounded-lg text-[8.5px] font-bold text-gray-300";
    }
  }

  function openMediaModal() {
    const m = document.getElementById('mediaModal');
    const mImg = document.getElementById('modalImg');
    const mVid = document.getElementById('modalVid');
    const p = products[currentSlideIndex];
    mImg.classList.add('hidden'); mVid.classList.add('hidden');
    if(activeTab === 'foto') {
      mImg.src = p.img; mImg.classList.remove('hidden');
    } else {
      document.getElementById('modalVidSrc').src = p.vid; mVid.load(); mVid.play(); mVid.classList.remove('hidden');
    }
    m.classList.add('show');
  }

  function closeMediaModal() {
    document.getElementById('mediaModal').classList.remove('show');
    document.getElementById('modalVid').pause();
  }

  function openOrderModal() { document.getElementById('orderModal').classList.add('show'); }
  function closeOrderModal() { document.getElementById('orderModal').classList.remove('show'); }

  function submitWAOrder() {
    const nama = document.getElementById('modalNama').value.trim();
    if(!nama) { alert("Isi nama dulu!"); return; }
    const p = products[currentSlideIndex];
    const sub = document.querySelector('input[name="sub"]:checked')?.value || document.getElementById('subSelect')?.value || "-";
    const uk = document.getElementById('ukuran')?.value.trim() || "-";
    const jml = document.getElementById('jumlah')?.value.trim() || "-";
    const cat = document.getElementById('modalCatatan').value.trim();

    let msg = `📋 *ORDER ARCI*\n👤 *Nama:* ${nama}\n📌 *Produk:* ${p.title}\n🔹 *Pilihan:* ${sub}\n📏 *Ukuran:* ${uk}\n📦 *Jumlah:* ${jml}`;
    if(cat) msg += `\n📝 *Catatan:* ${cat}`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    closeOrderModal();
  }

  window.onload = renderSlide;
</script>
</body>
</html>
