<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCI — Cetak Stiker Kustom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-950">

  <!-- Mobile frame -->
  <div class="w-[390px] h-[844px] mx-auto my-6 relative overflow-hidden rounded-[2rem] bg-black text-white font-sans select-none border border-white/10 flex flex-col justify-between">

    <!-- Top bar -->
    <div class="relative z-20 flex items-center justify-between px-5 pt-5 pb-2 bg-gradient-to-b from-black via-black/80 to-transparent">
      <div class="flex items-center gap-2">
        <img src="logo test.png" alt="Logo" class="h-7 w-auto object-contain">
        <span class="font-semibold text-sm">ARCI</span>
      </div>
      <span class="text-[10px] tracking-widest border border-white/30 rounded-full px-3 py-1 text-white/80 uppercase">
        Sticker Studio
      </span>
    </div>

    <!-- AREA PREVIEW VISUAL BERDAMPINGAN (FOTO & VIDEO) -->
    <div class="relative z-10 px-4 py-2 my-auto">
      <p class="text-[10px] text-yellow-400 font-bold uppercase tracking-wider mb-2 text-center">Visual Preview Bahan</p>
      
      <div class="grid grid-cols-2 gap-2">
        <!-- 1. KOTAK FOTO -->
        <div class="relative h-[180px] rounded-xl overflow-hidden border border-white/15 bg-white/5">
          <span class="absolute top-2 left-2 z-10 text-[8px] font-bold bg-black/70 text-white px-2 py-0.5 rounded backdrop-blur-md">FOTO</span>
          <img id="previewImg" src="stiker.jpg" class="w-full h-full object-cover transition-all duration-300">
        </div>

        <!-- 2. KOTAK VIDEO LOOP -->
        <div class="relative h-[180px] rounded-xl overflow-hidden border border-white/15 bg-white/5">
          <span class="absolute top-2 left-2 z-10 text-[8px] font-bold bg-yellow-400 text-black px-2 py-0.5 rounded backdrop-blur-md">VIDEO TEKSTUR</span>
          <video id="previewVideo" autoplay loop muted playsinline class="w-full h-full object-cover transition-all duration-300">
            <source id="videoSource" src="stiker-bg.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>

    <!-- Bottom content / Konfigurasi -->
    <div class="relative z-20 px-5 pb-5 max-h-[480px] overflow-y-auto bg-gradient-to-t from-black via-black/90 to-transparent pt-4">

      <h1 class="text-2xl font-extrabold leading-tight mb-2">
        STICKER <span class="text-yellow-400">KUSTOM</span>
      </h1>

      <!-- OPSI STIKER FOKUS UTAMA -->
      <div id="stickerOptions" class="my-2 pt-2 border-t border-white/10 text-left bg-black/60 backdrop-blur-sm p-3 rounded-xl border border-white/5">
        
        <!-- 1. BAHAN STIKER -->
        <div class="mb-3">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">1. Pilih Bahan Stiker</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="vinyl" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Vinyl
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="transparan" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Transparan
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="chromo" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Chromo
              </div>
            </label>
          </div>
        </div>

        <!-- 2. LAMINATING -->
        <div class="mb-3">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">2. Lapisan Laminating</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Glossy" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Glossy
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Doff" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Doff
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Tanpa Laminating" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Tanpa
              </div>
            </label>
          </div>
        </div>

        <!-- 3. CUTTING -->
        <div class="mb-2">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">3. Jenis Potong / Cutting</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Kiss Cut" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Kiss Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Die Cut" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Die Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Potong Kotak" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Kotak
              </div>
            </label>
          </div>
        </div>

      </div>

      <!-- Divider -->
      <div class="h-px bg-white/10 mb-2"></div>

      <div class="flex items-center justify-between text-[10px] tracking-widest text-white/60">
        <span>DIGITAL VINYL PRINT</span>
        <span>EST. 2020</span>
      </div>
    </div>
  </div>

<script>
  // Mapping Foto & Video khusus untuk setiap bahan
  const mediaData = {
    "vinyl": {
      img: "stiker.jpg",
      video: "stiker-bg.mp4"
    },
    "transparan": {
      img: "stiker-transparan.jpg",  // Sesuaikan nama file fotomu
      video: "stiker-transparan.mp4" // Sesuaikan nama file videomu
    },
    "chromo": {
      img: "stiker-chromo.jpg",      // Sesuaikan nama file fotomu
      video: "stiker-chromo.mp4"     // Sesuaikan nama file videomu
    }
  };

  // Event Listener pas Tombol Bahan diklik
  document.querySelectorAll('input[name="bahan"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      const bahan = e.target.value;
      const data = mediaData[bahan];

      if (data) {
        // Update Foto
        const imgEl = document.getElementById('previewImg');
        if (imgEl && data.img) imgEl.src = data.img;

        // Update Video Loop
        const videoEl = document.getElementById('previewVideo');
        const sourceEl = document.getElementById('videoSource');
        if (videoEl && sourceEl && data.video) {
          sourceEl.src = data.video;
          videoEl.load();
          videoEl.play();
        }
      }
    });
  });
</script>
</body>
</html>
