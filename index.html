<script>
  const WA_ADMIN_NUMBER = "6281234567890"; // Ganti nomor WA ARCI di sini (pakai kode 62)

  const productMatrix = {
    "vinyl": { title: "Stiker Vinyl Premium ⭐ REKOMENDASI", desc: "Bahan basis plastik lentur, 100% tahan air & tidak mudah robek. Paling ideal untuk botol dingin & kemasan outdoor." },
    "chromo": { title: "Stiker Kromo (Chromo) 🏷️ HEMAT", desc: "Bahan kertas mengkilap ekonomis. Cocok untuk label kemasan makanan kering & box kemasan." },
    "transparan": { title: "Stiker Transparan ✨ BENING", desc: "Bening tembus pandang estetik. Sangat anggun untuk botol kaca, jar, & kosmetik." },
    "hologram": { title: "Stiker Hologram 🔥 LARIS", desc: "Efek pelangi 3D mengkilap mencolok saat memantul cahaya. Favorit stiker komunitas & brand." },
    "chrome": { title: "Stiker Chrome 👑 MEWAH", desc: "Bahan metallic mengkilap seperti cermin/besi. Kesan sangat eksklusif untuk logo produk." }
  };

  // Tab Switcher Foto vs Video
  function switchMediaTab(slideNum, type) {
    const img = document.getElementById(`prevImg${slideNum}`);
    const vid = document.getElementById(`prevVid${slideNum}`);
    const tabF = document.getElementById(`tabFoto${slideNum}`);
    const tabV = document.getElementById(`tabVideo${slideNum}`);

    if (!img || !vid) return;

    if (type === 'foto') {
      img.classList.remove('hidden');
      vid.classList.add('hidden');
      tabF.className = "px-2.5 py-1 rounded-lg text-[9px] font-bold bg-yellow-400 text-black shadow transition";
      tabV.className = "px-2.5 py-1 rounded-lg text-[9px] font-bold text-zinc-400 hover:text-white transition";
    } else {
      img.classList.add('hidden');
      vid.classList.remove('hidden');
      tabV.className = "px-2.5 py-1 rounded-lg text-[9px] font-bold bg-yellow-400 text-black shadow transition";
      tabF.className = "px-2.5 py-1 rounded-lg text-[9px] font-bold text-zinc-400 hover:text-white transition";
    }
  }

  // Update Deskripsi Bahan Otomatis
  function updateVisuals() {
    const b = document.querySelector('input[name="bahan1"]:checked')?.value || "vinyl";
    const data = productMatrix[b];
    if (data) {
      document.getElementById('descTitle1').textContent = data.title;
      document.getElementById('descText1').textContent = data.desc;
    }
  }

  document.querySelectorAll('input[name="bahan1"]').forEach(el => el.addEventListener('change', updateVisuals));

  // Modal Controls
  function openOrderModal() { document.getElementById('orderModal').classList.add('show'); }
  function closeOrderModal() { document.getElementById('orderModal').classList.remove('show'); }
  function openSosmedModal() { document.getElementById('sosmedModal').classList.add('show'); }
  function closeSosmedModal() { document.getElementById('sosmedModal').classList.remove('show'); }
  function toggleQuickMenu() { openSosmedModal(); } // Atau arahkan ke menu slide

  // Kirim Form WA
  function submitWAOrder() {
    const nama = document.getElementById('modalNama').value.trim();
    if (!nama) { 
      alert("Isi nama pemesan dulu bro!"); 
      return; 
    }
    const catatan = document.getElementById('modalCatatan').value.trim();
    const b = document.querySelector('input[name="bahan1"]:checked')?.value || "vinyl";
    const l = document.querySelector('input[name="lam1"]:checked')?.value || "Glossy";
    const c = document.querySelector('input[name="cut1"]:checked')?.value || "Kiss Cut";
    const uk = document.getElementById('ukuran1').value.trim() || "Standar A3+";
    const qty = document.getElementById('jumlah1').value.trim() || "1 Lembar";

    let msg = `📋 *FORM ORDER ARCI STUDIO*\n━━━━━━━━━━━━━━━━━━\n👤 *Nama Pemesan:* ${nama}\n📌 *PRODUK:* Sticker Kustom A3+\n🔹 *Bahan:* ${b.toUpperCase()}\n🔹 *Laminasi:* ${l}\n🔹 *Cutting:* ${c}\n📏 *Ukuran:* ${uk}\n📦 *Jumlah:* ${qty}`;
    if (catatan) msg += `\n📝 *Catatan:* ${catatan}`;
    msg += `\n━━━━━━━━━━━━━━━━━━\n*Mohon info total estimasi harga & instruksi kirim file. Terima kasih!*`;

    window.open(`https://wa.me/${WA_ADMIN_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    closeOrderModal();
  }
</script>
