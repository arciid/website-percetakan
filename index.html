<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCI — Cetak Stiker Kustom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-950">

  <!-- Mobile frame -->
  <div class="w-[390px] h-[844px] mx-auto my-6 relative overflow-hidden rounded-[2rem] bg-black text-white font-sans select-none border border-white/10">

    <!-- Visual layer / Background Stiker -->
    <div id="slides" class="absolute inset-0">
      <img id="stickerPreview" src="stiker.jpg" class="absolute inset-0 w-full h-full object-cover opacity-70 transition-all duration-500">
      <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/20 to-black/95"></div>
    </div>

    <!-- Top bar -->
    <div class="relative z-20 flex items-center justify-between px-5 pt-5">
      <div class="flex items-center gap-2">
        <img src="logo test.png" alt="Logo" class="h-7 w-auto object-contain">
        <span class="font-semibold text-sm">ARCI</span>
      </div>
      <span class="text-[10px] tracking-widest border border-white/30 rounded-full px-3 py-1 text-white/80 uppercase">
        Sticker Studio
      </span>
    </div>

    <!-- Bottom content -->
    <div class="absolute bottom-0 left-0 right-0 z-20 px-5 pb-5 max-h-[740px] overflow-y-auto">

      <p class="text-yellow-400 text-[11px] tracking-widest mb-1">LAYANAN UTAMA</p>
      <h1 class="text-3xl font-extrabold leading-tight mb-3">
        STICKER <br><span class="text-yellow-400">KUSTOM</span>
      </h1>

      <!-- OPSI STIKER FOKUS UTAMA -->
      <div id="stickerOptions" class="my-3 pt-3 border-t border-white/10 text-left bg-black/60 backdrop-blur-sm p-3 rounded-xl border border-white/5">
        <p class="text-[11px] font-bold text-yellow-400 mb-2.5 uppercase tracking-wider">Konfigurasi Stiker:</p>
        
        <!-- 1. BAHAN STIKER -->
        <div class="mb-3">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">1. Pilih Bahan</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="vinyl" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Vinyl
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="transparan" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Transparan
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="chromo" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Chromo
              </div>
            </label>
          </div>
        </div>

        <!-- 2. LAMINATING -->
        <div class="mb-3">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">2. Lapisan Laminating</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Glossy" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Glossy
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Doff" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Doff
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Tanpa Laminating" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Tanpa
              </div>
            </label>
          </div>
        </div>

        <!-- 3. CUTTING -->
        <div class="mb-3">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">3. Jenis Potong / Cutting</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Kiss Cut" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Kiss Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Die Cut" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Die Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Potong Kotak" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Kotak
              </div>
            </label>
          </div>
        </div>

      </div>

      <!-- Divider -->
      <div class="h-px bg-white/10 mb-3"></div>

      <div class="flex items-center justify-between text-[10px] tracking-widest text-white/60">
        <span>DIGITAL VINYL PRINT</span>
        <span>EST. 2020</span>
      </div>
    </div>
  </div>

<script>
  // Mapping gambar khusus sesuai pilihan bahan stiker
  const stickerImages = {
    "vinyl": "stiker.jpg",
    "transparan": "stiker-transparan.jpg", // pastikan upload gambar ini kalau ada
    "chromo": "stiker-chromo.jpg"          // pastikan upload gambar ini kalau ada
  };

  // Event listener: Ganti preview gambar latar saat pilihan bahan diklik
  document.querySelectorAll('input[name="bahan"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      const selectedBahan = e.target.value;
      const previewImg = document.getElementById('stickerPreview');
      
      if (previewImg && stickerImages[selectedBahan]) {
        previewImg.src = stickerImages[selectedBahan];
      }
    });
  });
</script>
</body>
</html>
