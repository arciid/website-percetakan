<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCI — Pilih Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-950">

  <!-- Mobile frame -->
  <div class="w-[390px] h-[844px] mx-auto my-6 relative overflow-hidden rounded-[2rem] bg-black text-white font-sans select-none border border-white/10">

    <!-- Visual layers (crossfade) -->
    <div id="slides" class="absolute inset-0"></div>

    <!-- Top bar -->
    <div class="relative z-20 flex items-center justify-between px-5 pt-5">
      <div class="flex items-center gap-2">
        <img src="logo test.png" alt="Logo" class="h-7 w-auto object-contain">
        <span class="font-semibold text-sm">ARCI</span>
      </div>
      <span class="text-[10px] tracking-widest border border-white/30 rounded-full px-3 py-1 text-white/80">
        DIGITAL ADVERTISING
      </span>
    </div>

    <!-- Bottom content -->
    <div class="absolute bottom-0 left-0 right-0 z-20 px-5 pb-5 max-h-[720px] overflow-y-auto">

      <p id="eyebrow" class="text-yellow-400 text-[11px] tracking-widest mb-1">BERBAGAI PRODUK</p>
      <h1 id="title" class="text-3xl font-extrabold leading-tight mb-3">
        KARTU <br><span class="text-yellow-400">NAMA</span>
      </h1>

      <!-- Tombol pilihan produk -->
      <div id="productButtons" class="flex flex-wrap gap-1.5 mb-3"></div>

      <!-- OPSI STIKER RINGKAS (HANYA MUNCUL PAS KLIK STIKER) -->
      <div id="stickerOptions" class="hidden my-3 pt-3 border-t border-white/10 text-left bg-black/60 backdrop-blur-sm p-3 rounded-xl border border-white/5">
        <p class="text-[11px] font-bold text-yellow-400 mb-2.5 uppercase tracking-wider">Spesifikasi Stiker:</p>
        
        <!-- BAHAN -->
        <div class="mb-2.5">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">1. Bahan Stiker</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="bahan" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Vinyl
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Transparan
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Chromo
              </div>
            </label>
          </div>
        </div>

        <!-- LAMINATING -->
        <div class="mb-2.5">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">2. Laminating</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="laminating" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Glossy
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Doff
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Tanpa
              </div>
            </label>
          </div>
        </div>

        <!-- CUTTING -->
        <div class="mb-1">
          <span class="text-[10px] text-gray-400 block mb-1 font-medium">3. Jenis Cutting</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="cutting" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Kiss Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Die Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition">
                Kotak
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="h-px bg-white/10 mb-3"></div>

      <div class="flex items-center justify-between text-[10px] tracking-widest text-white/60">
        <span id="tag">DIGITAL · OFFSET</span>
        <span>EST. 2020</span>
      </div>
    </div>
  </div>

<script>
  // ==== Data produk: setiap tombol = 1 tampilan visual ====
  const products = [
    { label: "Kartu Nama", eyebrow: "BERBAGAI PRODUK", title: ["Kartu", "Nama"], tag: "DIGITAL · OFFSET", img: "kartu nama.jpg" },
    { label: "Brosur", eyebrow: "BERBAGAI PRODUK", title: ["Flyer &", "Brosur"], tag: "OFFSET · A5", img: "brosur.jpg" },
    { label: "Undangan", eyebrow: "BERBAGAI PRODUK", title: ["Undangan", "Pernikahan"], tag: "DIGITAL · SOFTCOVER", img: "undangan.jpg" },
    { label: "Stiker", eyebrow: "BERBAGAI PRODUK", title: ["Sticker", "Kustom"], tag: "DIGITAL · VINYL", img: "stiker.jpg" },
    { label: "Banner", eyebrow: "BERBAGAI PRODUK", title: ["Banner", "Albatros"], tag: "OUTDOOR · FLEXI", img: "banner.jpg" }
  ];

  let current = 0;
  const slidesEl = document.getElementById('slides');
  const btnWrap = document.getElementById('productButtons');

  // build visual layers
  products.forEach((p, i) => {
    const layer = document.createElement('div');
    layer.className = "slide absolute inset-0 transition-opacity duration-500 ease-out";
    layer.style.opacity = i === 0 ? "1" : "0";
    layer.innerHTML = `
      <img src="${p.img}" class="absolute inset-0 w-full h-full object-cover opacity-70">
      <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/20 to-black/90"></div>
    `;
    slidesEl.appendChild(layer);
  });

  // build selector buttons
  products.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.dataset.index = i;
    btn.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95";
    btn.textContent = p.label;
    btn.addEventListener('click', () => goTo(i));
    btnWrap.appendChild(btn);
  });

  function render() {
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.style.opacity = i === current ? "1" : "0";
    });

    document.querySelectorAll('.product-btn').forEach((el, i) => {
      el.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95 "
        + (i === current
            ? "bg-yellow-400 text-black border-yellow-400"
            : "bg-white/5 text-white/70 border-white/20");
    });

    const p = products[current];
    document.getElementById('eyebrow').textContent = p.eyebrow;
    document.getElementById('title').innerHTML = `${p.title[0]} <br><span class="text-yellow-400">${p.title[1]}</span>`;
    document.getElementById('tag').textContent = p.tag;

    // Tampilkan opsi stiker HANYA kalau tombol "Stiker" aktif
    const stickerOpt = document.getElementById('stickerOptions');
    if (stickerOpt) {
      if (p.label === "Stiker") {
        stickerOpt.classList.remove('hidden');
      } else {
        stickerOpt.classList.add('hidden');
      }
    }
  }

  function goTo(index) {
    current = index;
    render();
  }

  render();
</script>
</body>
</html>
