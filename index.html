<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCI — Cetak Stiker Kustom</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-950">

  <!-- Mobile frame -->
  <div class="w-[390px] h-[844px] mx-auto my-6 relative overflow-hidden rounded-[2rem] bg-black text-white font-sans select-none border border-white/10 flex flex-col justify-between">

    <!-- 1. BACKGROUND UTAMA FRAME -->
    <div id="slides" class="absolute inset-0 z-0">
      <video id="bgVideo" autoplay loop muted playsinline poster="gbr-vinyl.JPG" class="w-full h-full object-cover opacity-85 transition-all duration-500">
        <source id="bgVideoSource" src="stiker-bg.mp4" type="video/mp4">
        <img src="gbr-vinyl.JPG" class="w-full h-full object-cover">
      </video>
      <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/90"></div>
    </div>

    <!-- Top bar -->
    <div class="relative z-20 flex items-center justify-between px-5 pt-5 pb-2">
      <div class="flex items-center gap-2">
        <img src="logo test.png" alt="Logo" class="h-7 w-auto object-contain">
        <span class="font-semibold text-sm">ARCI</span>
      </div>
      <span class="text-[10px] tracking-widest border border-white/30 rounded-full px-3 py-1 text-white/80 uppercase backdrop-blur-md bg-black/30">
        Sticker Studio
      </span>
    </div>

    <!-- 2. AREA PREVIEW VISUAL BERDAMPINGAN (FOTO & VIDEO) -->
    <div class="relative z-10 px-4 pt-1 pb-2 mt-1">
      <p class="text-[10px] text-yellow-400 font-bold uppercase tracking-wider mb-2 text-center drop-shadow">Visual Detail Bahan</p>
      
      <div class="grid grid-cols-2 gap-2">
        <!-- KOTAK FOTO PREVIEW -->
        <div class="relative h-[230px] rounded-xl overflow-hidden border border-white/20 bg-black/50 backdrop-blur-sm shadow-lg">
          <span class="absolute top-2 left-2 z-10 text-[8px] font-bold bg-black/70 text-white px-2 py-0.5 rounded border border-white/10">FOTO</span>
          <img id="previewImg" src="gbr-vinyl.JPG" class="w-full h-full object-cover transition-all duration-300">
        </div>

        <!-- KOTAK VIDEO PREVIEW TEKSTUR -->
        <div class="relative h-[230px] rounded-xl overflow-hidden border border-white/20 bg-black/50 backdrop-blur-sm shadow-lg">
          <span class="absolute top-2 left-2 z-10 text-[8px] font-bold bg-yellow-400 text-black px-2 py-0.5 rounded">VIDEO TEKSTUR</span>
          <video id="previewVideo" autoplay loop muted playsinline poster="gbr-vinyl.JPG" class="w-full h-full object-cover transition-all duration-300">
            <source id="videoSource" src="video-vinyl.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <!-- KETERANGAN BAHAN (Sudah ditambahkan id descTitle & descText di sini) -->
      <div id="bahanDescription" class="mt-2 p-2 rounded-lg bg-black/60 backdrop-blur-md border border-white/10 text-[10px] text-gray-300 leading-relaxed">
        <p><strong class="text-yellow-400" id="descTitle">Stiker Vinyl:</strong> <span id="descText">Bahan plastik tahan air & lentur, tidak mudah robek. Cocok untuk kemasan outdoor & botol.</span></p>
      </div>
    </div>

    <!-- 3. KONFIGURASI PILIHAN STIKER -->
    <div class="relative z-20 px-5 pb-4 max-h-[380px] overflow-y-auto">

      <h1 class="text-xl font-extrabold leading-tight mb-1">
        STICKER <span class="text-yellow-400">KUSTOM</span>
      </h1>

      <div id="stickerOptions" class="my-2 pt-2 border-t border-white/10 text-left bg-black/70 backdrop-blur-md p-2.5 rounded-xl border border-white/10 shadow-2xl">
        
        <!-- 1. BAHAN STIKER -->
        <div class="mb-2.5">
          <span class="text-[10px] text-gray-300 block mb-1 font-medium">1. Pilih Bahan Stiker</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="vinyl" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Vinyl
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="transparan" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Transparan
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="bahan" value="chromo" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Chromo
              </div>
            </label>
          </div>
        </div>

        <!-- 2. LAMINATING -->
        <div class="mb-2.5">
          <span class="text-[10px] text-gray-300 block mb-1 font-medium">2. Lapisan Laminating</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Glossy" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Glossy
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Doff" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Doff
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="laminating" value="Tanpa Laminating" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Tanpa
              </div>
            </label>
          </div>
        </div>

        <!-- 3. CUTTING -->
        <div class="mb-1.5">
          <span class="text-[10px] text-gray-300 block mb-1 font-medium">3. Jenis Potong / Cutting</span>
          <div class="grid grid-cols-3 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Kiss Cut" class="peer hidden" checked>
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Kiss Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Die Cut" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Die Cut
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cutting" value="Potong Kotak" class="peer hidden">
              <div class="text-[9px] py-1.5 px-1 rounded border border-white/20 bg-white/5 text-center peer-checked:border-yellow-400 peer-checked:bg-yellow-400/20 peer-checked:text-yellow-400 transition font-semibold">
                Kotak
              </div>
            </label>
          </div>
        </div>

      </div>

      <!-- Divider -->
      <div class="h-px bg-white/10 mb-2"></div>

      <div class="flex items-center justify-between text-[10px] tracking-widest text-white/60">
        <span>DIGITAL VINYL PRINT</span>
        <span>EST. 2020</span>
      </div>
    </div>
  </div>

<script>
  // Data Media + Deskripsi Keterangan Bahan
  const mediaData = {
    "vinyl": {
      title: "Stiker Vinyl:",
      desc: "Bahan plastik tahan air & lentur, tidak mudah robek. Cocok untuk kemasan outdoor & botol.",
      img: "gbr-vinyl.JPG",
      video: "video-vinyl.mp4"
    },
    "transparan": {
      title: "Stiker Transparan:",
      desc: "Bening tembus pandang. Ideal untuk kemasan botol kaca/jar yang ingin memperlihatkan isi produk.",
      img: "stiker-transparan.jpg",
      video: "stiker-transparan.mp4"
    },
    "chromo": {
      title: "Stiker Chromo:",
      desc: "Bahan kertas mengkilap. Pilihan paling hemat untuk label kemasan kering & box pengiriman.",
      img: "stiker-chromo.jpg",
      video: "stiker-chromo.mp4"
    }
  };

  // Event Listener saat Tombol Bahan diklik
  document.querySelectorAll('input[name="bahan"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      const bahan = e.target.value;
      const data = mediaData[bahan];

      if (!data) return;

      // 1. Update Teks Deskripsi
      const titleEl = document.getElementById('descTitle');
      const textEl = document.getElementById('descText');
      if (titleEl) titleEl.textContent = data.title;
      if (textEl) textEl.textContent = data.desc;

      // 2. Update Preview Foto (Ganti gambar kecil)
      const imgEl = document.getElementById('previewImg');
      if (imgEl && data.img) {
        imgEl.src = data.img;
      }

      // 3. Update Preview Video Kotak (Hanya video kecil di samping foto)
      const videoEl = document.getElementById('previewVideo');
      const sourceEl = document.getElementById('videoSource');
      if (videoEl && sourceEl && data.video) {
        sourceEl.src = data.video;
        videoEl.load();
        videoEl.play().catch(err => console.log("Autoplay error:", err));
      }
    });
  });
</script>
</body>
</html>
