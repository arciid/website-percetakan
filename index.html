<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the arci — Pilih Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-950">

  <!-- Mobile frame -->
  <div class="w-[390px] h-[844px] mx-auto my-6 relative overflow-hidden rounded-[2rem] bg-black text-white font-sans select-none">

    <!-- Visual layers (crossfade) -->
    <div id="slides" class="absolute inset-0"></div>

    <!-- Top bar -->
    <div class="relative z-20 flex items-center justify-between px-5 pt-5">
      <div class="flex items-center gap-2">
        <span class="w-7 h-7 rounded-full bg-yellow-400 flex items-center justify-center text-black text-sm">⚡</span>
        <span class="font-semibold text-sm">the arci</span>
      </div>
      <span class="text-[10px] tracking-widest border border-white/30 rounded-full px-3 py-1 text-white/80">
        DIGITAL ADVERTISING
      </span>
    </div>

    <!-- Slide index -->
    <div class="relative z-20 mt-40 px-5">
      <div class="flex items-center gap-2">
        <span class="w-6 h-px bg-yellow-400"></span>
        <span id="slideIndex" class="text-yellow-400 text-xs tracking-widest">01 / 06</span>
      </div>
    </div>

    <!-- Bottom content -->
    <div class="absolute bottom-0 left-0 right-0 z-20 px-5 pb-5">

      <p id="eyebrow" class="text-yellow-400 text-[11px] tracking-widest mb-1">PREMIUM / KARTU NAMA</p>
      <h1 id="title" class="text-4xl font-extrabold leading-tight mb-4">
        Business <br><span class="text-yellow-400">Card</span>
      </h1>

      <!-- Tombol pilihan produk: sentuh buat ganti tampilan visual -->
      <div id="productButtons" class="flex flex-wrap gap-1.5 mb-4"></div>

      <!-- Divider -->
      <div class="h-px bg-white/10 mb-3"></div>

      <div class="flex items-center justify-between text-[10px] tracking-widest text-white/60">
        <span id="tag">DIGITAL · OFFSET</span>
        <span>EST. 2026</span>
      </div>
    </div>
  </div>


<script>
  // ==== Data produk: setiap tombol = 1 tampilan visual ====
  const products = [
    { label: "Kartu Nama", eyebrow: "PREMIUM / KARTU NAMA", title: ["Business", "Card"], tag: "DIGITAL · OFFSET",
      img: "https://images.unsplash.com/photo-1606166187734-a4cb74079037?q=80&w=1200&auto=format&fit=crop" },
    { label: "Brosur", eyebrow: "PREMIUM / BROSUR", title: ["Flyer &", "Brosur"], tag: "OFFSET · A5",
      img: "https://images.unsplash.com/photo-1626785774573-4b799315345d?q=80&w=1200&auto=format&fit=crop" },
    { label: "Undangan", eyebrow: "PREMIUM / UNDANGAN", title: ["Wedding", "Invitation"], tag: "DIGITAL · SOFTCOVER",
      img: "https://images.unsplash.com/photo-1607344645866-009c320b63e0?q=80&w=1200&auto=format&fit=crop" },
    { label: "Stiker", eyebrow: "PREMIUM / STIKER", title: ["Custom", "Sticker"], tag: "DIGITAL · VINYL",
      img: "https://images.unsplash.com/photo-1611162458324-aae1eb4129a4?q=80&w=1200&auto=format&fit=crop" },
    { label: "Banner", eyebrow: "PREMIUM / BANNER", title: ["Outdoor", "Banner"], tag: "OUTDOOR · FLEXI",
      img: "https://images.unsplash.com/photo-1516251193007-45ef944ab0c6?q=80&w=1200&auto=format&fit=crop" }
  ];

  let current = 0;
  const slidesEl = document.getElementById('slides');
  const btnWrap = document.getElementById('productButtons');

  // build visual layers
  products.forEach((p, i) => {
    const layer = document.createElement('div');
    layer.className = "slide absolute inset-0 transition-opacity duration-500 ease-out";
    layer.style.opacity = i === 0 ? "1" : "0";
    layer.innerHTML = `
      <img src="${p.img}" class="absolute inset-0 w-full h-full object-cover opacity-70">
      <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/20 to-black/90"></div>
    `;
    slidesEl.appendChild(layer);
  });

  // build selector buttons
  products.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.dataset.index = i;
    btn.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95";
    btn.textContent = p.label;
    btn.addEventListener('click', () => goTo(i));
    btnWrap.appendChild(btn);
  });

  function render() {
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.style.opacity = i === current ? "1" : "0";
    });

    document.querySelectorAll('.product-btn').forEach((el, i) => {
      el.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95 "
        + (i === current
            ? "bg-yellow-400 text-black border-yellow-400"
            : "bg-white/5 text-white/70 border-white/20");
    });

    const p = products[current];
    document.getElementById('eyebrow').textContent = p.eyebrow;
    document.getElementById('title').innerHTML = `${p.title[0]} <br><span class="text-yellow-400">${p.title[1]}</span>`;
    document.getElementById('tag').textContent = p.tag;
    document.getElementById('slideIndex').textContent =
      String(current + 1).padStart(2, '0') + " / " + String(products.length).padStart(2, '0');
  }

  function goTo(index) {
    current = index;
    render();
  }

  render();
</script>
</body>
</html>
