<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCI — Pilih Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-950">

  <!-- Mobile frame -->
  <div class="w-[390px] h-[844px] mx-auto my-6 relative overflow-hidden rounded-[2rem] bg-black text-white font-sans select-none">

    <!-- Visual layers (crossfade) -->
    <div id="slides" class="absolute inset-0"></div>

    <!-- Top bar -->
    <div class="relative z-20 flex items-center justify-between px-5 pt-5">
      <div class="flex items-center gap-2">
        <img src="logo test.png" alt="Logo" class="h-7 w-auto object-contain">
        <span class="font-semibold text-sm">ARCI</span>
      </div>
      <span class="text-[10px] tracking-widest border border-white/30 rounded-full px-3 py-1 text-white/80">
        DIGITAL ADVERTISING
      </span>
    </div>

    <!-- Bottom content -->
    <div class="absolute bottom-0 left-0 right-0 z-20 px-5 pb-5">

      <p id="eyebrow" class="text-yellow-400 text-[11px] tracking-widest mb-1">KARTU NAMA</p>
      <h1 id="title" class="text-4xl font-extrabold leading-tight mb-4">
        KARTU <br><span class="text-yellow-400">NAMA</span>
      </h1>

      <!-- Tombol pilihan produk: sentuh buat ganti tampilan visual -->
      <div id="productButtons" class="flex flex-wrap gap-1.5 mb-4"></div>

       <section class="sticker-options-section">
  <div class="container">
    <div class="section-title">
      <h2>Pilihan Spesifikasi Stiker</h2>
      <p>Kustomisasi stiker kamu sesuai kebutuhan branding dan penggunaan.</p>
    </div>

    <!-- 1. PILIHAN BAHAN -->
    <div class="option-group">
      <h3 class="group-title"><i class="icon">📦</i> 1. Jenis Bahan Stiker</h3>
      <div class="option-grid">
        <label class="option-card">
          <input type="radio" name="bahan_stiker" value="vinyl" checked>
          <div class="card-box">
            <span class="badge-tag">Paling Laris</span>
            <h4>Stiker Vinyl</h4>
            <p>Bahan plastik tahan air & tidak mudah robek. Cocok untuk botol, kemasan outdoor, dan helm.</p>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="bahan_stiker" value="transparan">
          <div class="card-box">
            <h4>Vinyl Transparan</h4>
            <p>Bening tembus pandang. Ideal untuk kemasan botol kaca atau jar yang ingin memperlihatkan isi produk.</p>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="bahan_stiker" value="chromo">
          <div class="card-box">
            <span class="badge-tag eco">Economical</span>
            <h4>Stiker Chromo (Kertas)</h4>
            <p>Bahan dasar kertas mengkilap. Pilihan paling hemat untuk label kemasan kering & box pengiriman.</p>
          </div>
        </label>
      </div>
    </div>

    <!-- 2. PILIHAN LAMINATING -->
    <div class="option-group">
      <h3 class="group-title"><i class="icon">✨</i> 2. Lapisan Laminating (Finishing)</h3>
      <div class="option-grid">
        <label class="option-card">
          <input type="radio" name="laminating" value="glossy" checked>
          <div class="card-box">
            <h4>Laminating Glossy</h4>
            <p>Efek mengkilap, warna makin kontras & tajam. Tahan goresan dan memberikan kesan mewah.</p>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="laminating" value="doff">
          <div class="card-box">
            <h4>Laminating Doff (Matte)</h4>
            <p>Tampilan elegan tanpa pantulan cahaya. Tekstur halus dan terasa premium saat dipegang.</p>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="laminating" value="non">
          <div class="card-box">
            <h4>Tanpa Laminating</h4>
            <p>Hasil cetak standar tanpa lapisan tambahan. Pilihan ekonomis untuk penggunaan standar.</p>
          </div>
        </label>
      </div>
    </div>

    <!-- 3. PILIHAN JENIS CUTTING -->
    <div class="option-group">
      <h3 class="group-title"><i class="icon">✂️</i> 3. Jenis Potong / Cutting</h3>
      <div class="option-grid">
        <label class="option-card">
          <input type="radio" name="cutting" value="kisscut" checked>
          <div class="card-box">
            <span class="badge-tag">Praktis</span>
            <h4>Kiss Cut (Lembaran)</h4>
            <p>Dipotong sesuai pola logo tapi masih menempel di lembaran A3. Tinggal kelupas, lebih praktis Simpan.</p>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="cutting" value="diecut">
          <div class="card-box">
            <h4>Die Cut (Putus Per Pcs)</h4>
            <p>Dipotong putus tembus sampai kertas alasnya menjadi satuan/pcs. Cocok untuk stiker bagi-bagi/merchandise.</p>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="cutting" value="square">
          <div class="card-box">
            <h4>Potong Kotak / Sejajar</h4>
            <p>Potongan lurus menggunakan mesin potong/guillotine. Pilihan hemat untuk bentuk stiker persegi/persegi panjang.</p>
          </div>
        </label>
      </div>
    </div>

  </div>

      <!-- Divider -->
      <div class="h-px bg-white/10 mb-3"></div>

      <div class="flex items-center justify-between text-[10px] tracking-widest text-white/60">
        <span id="tag">DIGITAL · OFFSET</span>
        <span>EST. 2020</span>
      </div>
    </div>
  </div>

 
</section>

<script>
  // ==== Data produk: setiap tombol = 1 tampilan visual ====
  const products = [
    { label: "Kartu Nama", eyebrow: "BERBAGAI PRODUK", title: ["Kartu", "Nama"], tag: "DIGITAL · OFFSET",
      img: "kartu nama.jpg" },
    { label: "Brosur", eyebrow: "BERBAGAI PRODUK", title: ["Flyer &", "Brosur"], tag: "OFFSET · A5",
      img: "brosur.jpg" },
    { label: "Undangan", eyebrow: "BERBAGAI PRODUK", title: ["Undangan", "Pernikahan"], tag: "DIGITAL · SOFTCOVER",
      img: "undangan.jpg" },
    { label: "Stiker", eyebrow: "BERBAGAI PRODUK", title: ["Sticker", "Kustom"], tag: "DIGITAL · VINYL",
      img: "stiker.jpg" },
    { label: "Banner", eyebrow: "BERBAGAI PRODUK", title: ["Banner", "Albatros"], tag: "OUTDOOR · FLEXI",
      img: "banner.jpg" }
  ];

  let current = 0;
  const slidesEl = document.getElementById('slides');
  const btnWrap = document.getElementById('productButtons');

  // build visual layers
  products.forEach((p, i) => {
    const layer = document.createElement('div');
    layer.className = "slide absolute inset-0 transition-opacity duration-500 ease-out";
    layer.style.opacity = i === 0 ? "1" : "0";
    layer.innerHTML = `
      <img src="${p.img}" class="absolute inset-0 w-full h-full object-cover opacity-70">
      <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/20 to-black/90"></div>
    `;
    slidesEl.appendChild(layer);
  });

  // build selector buttons
  products.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.dataset.index = i;
    btn.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95";
    btn.textContent = p.label;
    btn.addEventListener('click', () => goTo(i));
    btnWrap.appendChild(btn);
  });

  function render() {
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.style.opacity = i === current ? "1" : "0";
    });

    document.querySelectorAll('.product-btn').forEach((el, i) => {
      el.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95 "
        + (i === current
            ? "bg-yellow-400 text-black border-yellow-400"
            : "bg-white/5 text-white/70 border-white/20");
      function render() {
    document.querySelectorAll('.slide').forEach((el, i) => {
      el.style.opacity = i === current ? "1" : "0";
    });

    document.querySelectorAll('.product-btn').forEach((el, i) => {
      el.className = "product-btn text-[9px] font-medium px-2.5 py-1 rounded-full border transition active:scale-95 "
        + (i === current
            ? "bg-yellow-400 text-black border-yellow-400"
            : "bg-white/5 text-white/70 border-white/20");
    });

    const p = products[current];
    document.getElementById('eyebrow').textContent = p.eyebrow;
    document.getElementById('title').innerHTML = `${p.title[0]} <br><span class="text-yellow-400">${p.title[1]}</span>`;
    document.getElementById('tag').textContent = p.tag;

    // Munculkan opsi stiker HANYA kalau tombol "Stiker" aktif
    const stickerOpt = document.getElementById('stickerOptions');
    if (stickerOpt) {
      if (p.label === "Stiker") {
        stickerOpt.classList.remove('hidden');
      } else {
        stickerOpt.classList.add('hidden');
      }
    }
  }
    });

    const p = products[current];
    document.getElementById('eyebrow').textContent = p.eyebrow;
    document.getElementById('title').innerHTML = `${p.title[0]} <br><span class="text-yellow-400">${p.title[1]}</span>`;
    document.getElementById('tag').textContent = p.tag;
  }

  function goTo(index) {
    current = index;
    render();
  }

  render();
</script>
</body>
</html>
